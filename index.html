        /* ── scrollbar ── */
        .no-scrollbar::-webkit-scrollbar {

        /* ── glass card ── */
        .glass {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(18px);

            border: 1px solid rgba(228, 228, 231, 0.6);
        }

        /* ── subtle shadow ── */
        .card-shadow {
            box-shadow: 0 8px 32px -8px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
        }

        .card-shadow-lg {
            box-shadow: 0 24px 64px -16px rgba(0, 0, 0, 0.10), 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        /* ── hover ── */
        .hover-lift {
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }

        .hover-lift:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 48px -12px rgba(124, 58, 237, 0.18);
        }

        /* ── sticky sidebar ── */
        @media (min-width: 1024px) {
            .sidebar-sticky {

                top: 80px;
                max-height: calc(100vh - 100px);
                overflow-y: auto;

        /* ── active nav pill ── */
        .nav-active {
            background: #18181b;
            color: #fff;
        }

        /* ── section fade-up on scroll (JS-driven) ── */
        .reveal {
            opacity: 0;
            transform: translateY(22px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .revealed {
            opacity: 1;
            transform: none;
        }

        /* ── progress dots ── */
        .dot-active {
            background: #18181b;
            width: 20px;
            border-radius: 4px;
        }

        /* ── chip ── */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        /* ── shimmer button ── */
        .btn-shimmer {
            background: linear-gradient(90deg, #18181b 35%, #3f3f46 50%, #18181b 65%);
            background-size: 200% 100%;
            animation: shimmer 2.4s linear infinite;
        }

        /* ── portal active ring ── */
        .portal-active {
            background: #fff;
            border-color: #18181b;
            box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.14);
        }

        /* ── stagger children ── */
        .stagger>*:nth-child(1) {
            animation-delay: 0.0s;
        }

        .stagger>*:nth-child(2) {
            animation-delay: 0.06s;
        }

        .stagger>*:nth-child(3) {
            animation-delay: 0.12s;
        }

        .stagger>*:nth-child(4) {
            animation-delay: 0.18s;
        }

        .stagger>*:nth-child(5) {
            animation-delay: 0.24s;
        }

        .stagger>*:nth-child(6) {
            animation-delay: 0.30s;
        }

            display: flex;
            gap: 8px;
